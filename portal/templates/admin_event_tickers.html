{% extends "base.html" %}
{% block title %}Admin · Tickers — MNT{% endblock %}
{% block content %}
  <section class="admin">
    <p><a href="{{ back }}">← Back</a></p>
    <h1>Edit tickers</h1>
    <p class="muted">{{ event["raw_headline"][:120] }}</p>

    <form method="post" action="/admin/events/{{ event['event_id'] }}/tickers"
          style="max-width: 640px;">
      <input type="hidden" name="ticker" value="{{ event['ticker'] }}">
      <input type="hidden" name="back" value="{{ back }}">

      <p style="margin: 0.75rem 0;">
        Primary ticker: <strong>{{ event["ticker"] }}</strong>
        <span class="muted">(change via the company edit page)</span>
      </p>

      <label style="display:block; margin: 0.75rem 0;">
        Additional tickers:<br>
        <input type="text" name="additional_tickers"
               value="{{ additional_tickers | join(', ') }}"
               placeholder="GMX.T, ANOTHER.V"
               style="width:100%; padding: 0.5rem; font-family: monospace;">
        <small class="muted">Comma- or space-separated. The article will appear under
        every company that owns any of these tickers (current or previous).</small>
      </label>

      <button type="submit" style="margin-top: 0.5rem; padding: 0.5rem 1rem;">Save</button>
    </form>
  </section>
{% endblock %}
